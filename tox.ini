[tox]
envlist =
  py{310,311,312,313,314,315}-lint,
  py{310,311,312,313,314,315}-unit,
  py{310,311,312,313,314,315}-bandit,
  py{310,311,312,313,314,315}-mypy,
  py312-pydocstyle
isolated_build = True
skip_missing_interpreters = True

[gh-actions]
python =
  3.10: py310
  3.11: py311
  3.12: py312
  3.13: py313
  3.14: py314

[testenv]
description =
  py{310,311,312,313,314,315}-unit: Run the unit tests
  py{310,311,312,313,314,315}-lint: Lint the Python code
  py{310,311,312,313,314,315}-bandit: Search for common security issues
  py{310,311,312,313,314,315}-mypy: Check for type safety
  py312-pydocstyle: docstring style checker

passenv =
  CI
  GITHUB_*
deps =
  py{310,311,312,313,314,315}-{unit,mypy}: -rrequirements.txt
  py{310,311,312,313,314,315}-lint: flake8-bugbear
  py{310,311,312,313,314,315}-lint: black
  py{310,311,312,313,314,315}-bandit: bandit
  py{310,311,312,313,314,315}-mypy: -rmypy-requirements.txt

setenv =
  py{310,311,312,313,314,315}-unit: LC_ALL = C.UTF-8

commands =
  py{310,311,312,313,314,315}-unit: make test
  py{310,311,312,313,314,315}-bandit: bandit --recursive cwlprov
  py{310,311,312,313,314,315}-lint: make flake8
  py{310,311,312,313,314,315}-lint: make format-check
  py{310,311,312,313,314,315}-mypy: make mypy

allowlist_externals =
  py{310,311,312,313,314,315}-lint: flake8
  py{310,311,312,313,314,315}-lint: black
  py{310,311,312,313,314,315}-{mypy,shellcheck,lint,unit,pydocstyle}: make

skip_install =
  py{310,311,312,313,314,315}-lint: true
  py{310,311,312,313,314,315}-bandit: true

[testenv:py312-pydocstyle]
commands = make diff_pydocstyle_report
deps =
    pydocstyle
    diff-cover
skip_install = true

